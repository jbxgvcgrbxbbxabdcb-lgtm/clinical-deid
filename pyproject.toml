[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-deid"
version = "0.1.0"
description = "Clinical De-identify — local FastAPI + React UI for synthetic clinical note redaction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  # hf: transformers + hub for deidentify(); DOCX/PDF text extraction pinned
  # explicitly (openmed multimodal ingesters lazy-import these; no OCR stack).
  "openmed[hf]>=2.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "pymupdf>=1.28",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.sdist]
include = [
  "/backend",
  "/frontend",
  "/deploy",
  "/README.md",
  "/LICENSE",
]
